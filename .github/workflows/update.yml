name: Update rjsxrd-filter subscription
#
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Run filter
        run: python rjsxrd-filter.py

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rjsxrd-filter.txt

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update rjsxrd-filter subscription"
            git push
          fi
